<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postava – Comic Book Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="home" href="index.html">COMIC BOOK GUIDE</a>
    <span class="crumbs" id="crumbs"></span>
  </header>

  <main class="wrap">
    <div id="state" class="state" data-i18n="c.loading">Načítám postavu…</div>
    <article id="content" hidden>
      <div class="hero-layout">
        <figure class="full-image" style="margin:0">
          <div class="frame backdrop"><img id="full" alt=""></div>
          <figcaption class="credit" id="credit"></figcaption>
        </figure>

        <div>
          <div class="char-title">
            <h1 id="name"></h1>
            <div class="real" id="real"></div>
            <div id="badges"></div>
          </div>

          <section class="panel">
            <h2 data-i18n="c.origin">Origin story</h2>
            <div id="origin" class="bio"><p class="state" data-i18n="c.originLoading">Načítám příběh z Wikipedie…</p></div>
          </section>

          <section class="panel">
            <h2 data-i18n="c.specs">Specifikace</h2>
            <dl class="specs" id="specs"></dl>
          </section>

          <section class="panel">
            <h2 data-i18n="c.powers">Schopnosti</h2>
            <div class="stats" id="stats"></div>
          </section>

          <section class="panel">
            <h2 data-i18n="c.appearance">Vzhled</h2>
            <dl class="specs" id="appearance"></dl>
          </section>
        </div>
      </div>

      <section class="panel">
        <h2 data-i18n="c.comics">Komiksy, ve kterých se postava objevila</h2>
        <ul class="comics" id="comics"></ul>
        <p class="source" id="comics-source"></p>
      </section>

      <section class="panel" id="tv-panel" hidden>
        <h2 data-i18n="c.tv">TV seriály</h2>
        <ul class="comics media" id="tv"></ul>
      </section>

      <section class="panel" id="films-panel" hidden>
        <h2 data-i18n="c.films">Filmy</h2>
        <ul class="comics media" id="films"></ul>
      </section>
      <p class="source" id="media-source" hidden data-i18n="c.mediaSource"></p>
    </article>
  </main>

  <script type="module" src="js/character.js"></script>
</body>
</html>
