<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- obrázky z Fandomu (static.wikia.nocookie.net) se s cizím referrerem nenačtou -->
  <meta name="referrer" content="no-referrer">
  <title>Postavy – Comic Book Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="home" href="index.html">COMIC BOOK GUIDE</a>
    <span class="switch" id="switch"></span>
  </header>

  <main class="wrap">
    <div class="universe-head">
      <h1 id="title">Postavy</h1>
      <span class="count" id="count"></span>
    </div>

    <form class="toolbar" id="toolbar" onsubmit="return false">
      <label><span data-i18n="u.search">Hledat</span>
        <input type="search" id="q" placeholder="Jméno postavy…" data-i18n-placeholder="u.searchPh" autocomplete="off">
      </label>
      <label><span data-i18n="u.sort">Řadit</span>
        <select id="sort">
          <option value="az" data-i18n="u.sort.az">A → Z</option>
          <option value="za" data-i18n="u.sort.za">Z → A</option>
          <option value="new" data-i18n="u.sort.new">Od nejnovějších</option>
          <option value="old" data-i18n="u.sort.old">Od nejstarších</option>
        </select>
      </label>
      <label><span data-i18n="u.type">Typ postavy</span>
        <select id="align">
          <option value="" data-i18n="u.type.all">Všechny</option>
          <option value="good" data-i18n="u.type.good">Hrdinové</option>
          <option value="bad" data-i18n="u.type.bad">Záporáci</option>
          <option value="neutral" data-i18n="u.type.neutral">Antihrdinové / neutrální</option>
        </select>
      </label>
    </form>

    <div id="state" class="state" data-i18n="u.loading">Načítám postavy…</div>
    <div class="grid" id="grid"></div>
  </main>

  <script type="module" src="js/universe.js"></script>
</body>
</html>
